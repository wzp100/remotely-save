# Publish a release when a version tag is pushed:
#   1. bump "version" in manifest.json / package.json / versions.json
#   2. optionally write release-notes/<version>.md
#   3. git tag <version> && git push origin <version>
# The release is built here from the tagged source, so what BRAT installs always matches the code.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"; exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build
        env:
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_AUTHORITY: ${{ secrets.ONEDRIVE_AUTHORITY }}
        run: |
          if [ -z "$ONEDRIVE_CLIENT_ID" ]; then echo "::error::ONEDRIVE_CLIENT_ID secret is missing"; exit 1; fi
          npm run build
          grep -q "$ONEDRIVE_CLIENT_ID" main.js || { echo "::error::OneDrive client ID not embedded in main.js"; exit 1; }

      - name: Package
        run: zip -X "RemotelySave-Local-${GITHUB_REF_NAME}.zip" main.js manifest.json styles.css LICENSE NOTICE README.md

      - name: Release notes
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else echo "Remotely Save 本地版 ${GITHUB_REF_NAME}" > notes.md; fi
          printf '\n\n安装：BRAT 添加 `%s`，或把 main.js、manifest.json、styles.css 放到 `.obsidian/plugins/remotely-save-local/`。\n' "$GITHUB_REPOSITORY" >> notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Remotely Save 本地版 $GITHUB_REF_NAME" \
            --notes-file notes.md --latest \
            main.js manifest.json styles.css "RemotelySave-Local-${GITHUB_REF_NAME}.zip"

      - name: Keep only the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then gh release delete "$tag" --yes --cleanup-tag; fi
          done
